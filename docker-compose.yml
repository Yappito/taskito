services:
  app:
    image: yappito/taskito:latest
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      - AUTH_URL=${AUTH_URL:?set AUTH_URL}
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTO_TAGGER_URL=${AUTO_TAGGER_URL:-}
      - AUTO_TAGGER_API_KEY=${AUTO_TAGGER_API_KEY:-}
      - ALLOW_DEMO_SEED=${ALLOW_DEMO_SEED:-false}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - SCHEDULER_INTERVAL_MS=${SCHEDULER_INTERVAL_MS:-60000}
      - SCHEDULER_TICK_TIMEOUT_MS=${SCHEDULER_TICK_TIMEOUT_MS:-600000}
      - SCHEDULER_DIGEST_HOUR_UTC=${SCHEDULER_DIGEST_HOUR_UTC:-7}
      - CRON_SECRET=${CRON_SECRET:-}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET:-}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION:-us-east-1}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT:-}
      - STORAGE_S3_ACCESS_KEY_ID=${STORAGE_S3_ACCESS_KEY_ID:-}
      - STORAGE_S3_SECRET_ACCESS_KEY=${STORAGE_S3_SECRET_ACCESS_KEY:-}
      - STORAGE_S3_SESSION_TOKEN=${STORAGE_S3_SESSION_TOKEN:-}
      - STORAGE_S3_FORCE_PATH_STYLE=${STORAGE_S3_FORCE_PATH_STYLE:-false}
      - STORAGE_S3_PREFIX=${STORAGE_S3_PREFIX:-}
      - AI_SECRET_MASTER_KEY=${AI_SECRET_MASTER_KEY:-}
      - AI_PROVIDER_HOST_ALLOWLIST=${AI_PROVIDER_HOST_ALLOWLIST:-}
      - AI_PROVIDER_REQUEST_TIMEOUT_MS=${AI_PROVIDER_REQUEST_TIMEOUT_MS:-}
      - AI_ALLOW_AUTH_SECRET_FALLBACK=${AI_ALLOW_AUTH_SECRET_FALLBACK:-}
      - AI_PROVIDER_ALLOW_PRIVATE_HOSTS=${AI_PROVIDER_ALLOW_PRIVATE_HOSTS:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TLS_REJECT_UNAUTHORIZED=${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      - SMTP_ALLOW_INSECURE_AUTH=${SMTP_ALLOW_INSECURE_AUTH:-false}
      - SMTP_CONNECT_TIMEOUT_MS=${SMTP_CONNECT_TIMEOUT_MS:-10000}
      - SMTP_MESSAGE_TIMEOUT_MS=${SMTP_MESSAGE_TIMEOUT_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/trpc/project.health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
