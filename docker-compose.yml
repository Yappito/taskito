services:
  migrate:
    image: yappito/taskito:latest
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: yappito/taskito:latest
    command: ["node", "server.js"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      - AUTH_URL=${AUTH_URL:?set AUTH_URL}
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTO_TAGGER_URL=${AUTO_TAGGER_URL:-}
      - AUTO_TAGGER_API_KEY=${AUTO_TAGGER_API_KEY:-}
      - ALLOW_DEMO_SEED=${ALLOW_DEMO_SEED:-false}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET:-}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION:-us-east-1}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT:-}
      - STORAGE_S3_ACCESS_KEY_ID=${STORAGE_S3_ACCESS_KEY_ID:-}
      - STORAGE_S3_SECRET_ACCESS_KEY=${STORAGE_S3_SECRET_ACCESS_KEY:-}
      - STORAGE_S3_SESSION_TOKEN=${STORAGE_S3_SESSION_TOKEN:-}
      - STORAGE_S3_FORCE_PATH_STYLE=${STORAGE_S3_FORCE_PATH_STYLE:-false}
      - STORAGE_S3_PREFIX=${STORAGE_S3_PREFIX:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/trpc/project.health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
